<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette and Gradient Overlays -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="50%" stop-color="#08070a" />
      <stop offset="100%" stop-color="#020203" />
    </radialGradient>

    <!-- Red Neon Glow Filter -->
    <filter id="neonRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feGaussianBlur stdDeviation="35" result="blur3" />
      <feGaussianBlur stdDeviation="70" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Badge Cyan/Blue Ambient Glow Filter -->
    <filter id="badgeBlueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="40" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Red Ground Reflection -->
    <linearGradient id="groundRedGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff002b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#800010" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Stadium Grass Gradient -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Badge Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Stadium Steel Structure Silhouette in Background Right -->
  <g opacity="0.15" stroke="#334155" stroke-width="2" fill="none">
    <path d="M1200 250 L1920 320 M1200 280 L1920 350 M1200 350 L1920 420" />
    <path d="M1350 260 L1350 500 M1550 280 L1550 550 M1750 300 L1750 600" />
    <path d="M1200 250 L1350 500 M1350 260 L1550 550 M1550 280 L1750 600" />
    <circle cx="1720" cy="320" r="4" fill="#64748b" />
    <circle cx="1840" cy="335" r="4" fill="#64748b" />
  </g>

  <!-- Ground Light Reflection -->
  <polygon points="400,900 1520,900 1750,1080 170,1080" fill="url(#groundRedGlow)" />

  <!-- CENTER LOGO GROUP -->
  <g transform="translate(960, 360)">

    <!-- Ambient Blue Glow behind Stadium Badge -->
    <circle cx="0" cy="-70" r="140" fill="#0284c7" opacity="0.35" filter="url(#badgeBlueGlow)" />

    <!-- 1. STADIUM BADGE EMBLEM -->
    <g transform="translate(0, -90) scale(0.95)">
      <!-- Outer White Cloud/Shield Shape -->
      <path d="M-110,-40 C-120,-80 -70,-110 0,-110 C70,-110 120,-80 110,-40 C130,-10 120,40 80,70 C40,90 -40,90 -80,70 C-120,40 -130,-10 -110,-40 Z" fill="#ffffff" filter="drop-shadow(0 0 15px rgba(255,255,255,0.6))" />
      
      <!-- Inner Shield / Stadium Bowl -->
      <path d="M-95,-35 C-105,-70 -60,-95 0,-95 C60,-95 105,-70 95,-35 C110,-10 100,35 70,60 C35,75 -35,75 -70,60 C-100,35 -110,-10 -95,-35 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="3" />

      <!-- Stadium Turf Pitch -->
      <ellipse cx="0" cy="-25" rx="65" ry="32" fill="url(#grassGrad)" stroke="#ffffff" stroke-width="2.5" />
      <ellipse cx="0" cy="-25" rx="40" ry="18" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
      <line x1="-65" y1="-25" x2="65" y2="-25" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

      <!-- Flying Pickleball / Tennis Ball -->
      <circle cx="68" cy="-82" r="14" fill="#fb923c" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 0 8px #f97316)" />
      <path d="M60,-88 C68,-80 68,-84 76,-76" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

      <!-- Badge Ribbon / Banner "PRO TURF" -->
      <path d="M-110,15 L-90,0 L90,0 L110,15 L95,45 L-95,45 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.8))" />
      <text x="0" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="2">
        PRO TURF
      </text>
    </g>

    <!-- 2. LARGE GLOWING NEON RED "PRO TURF" SIGN -->
    <!-- Red Ambient Glow Aura -->
    <text x="0" y="160" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="145" font-weight="900" fill="#ff0033" text-anchor="middle" letter-spacing="6" filter="url(#neonRedGlow)" opacity="0.95">
      PRO TURF
    </text>

    <!-- Main Vibrant Red Neon Letters -->
    <g filter="drop-shadow(0 0 20px #ff002b) drop-shadow(0 0 40px #cc0022)">
      <!-- Outer Dark Red Stroke for 3D Sign Depth -->
      <text x="0" y="160" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="145" font-weight="900" fill="#e60026" stroke="#800010" stroke-width="8" text-anchor="middle" letter-spacing="6">
        PRO TURF
      </text>

      <!-- Mid Bright Red Fill -->
      <text x="0" y="160" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="145" font-weight="900" fill="#ff1a40" text-anchor="middle" letter-spacing="6">
        PRO TURF
      </text>

      <!-- Inner Neon Core Highlight -->
      <text x="0" y="157" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="143" font-weight="900" fill="#ff6680" text-anchor="middle" letter-spacing="6" opacity="0.9">
        PRO TURF
      </text>
    </g>

  </g>

  <!-- Bottom Dark Fade for seamless text readability in Hero -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#bgGlow)" opacity="0.4" />
</svg>
